name: Duke GLB pilot - original art (sem disco)
on:
  push:
    paths:
      - "recomp/tools/local/build_duke_pilot.py"
      - "recomp/tools/local/character_model.py"
      - "recomp/tests/local/test_duke_pilot_generator.py"
      - ".github/workflows/duke-model-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preview rendering dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate original 19-part GLB prototype
        run: python recomp/tools/local/build_duke_pilot.py --out /tmp/duke-pilot
      - name: Check native rig contract
        run: |
          python recomp/tools/local/character_model.py /tmp/duke-pilot/model.json --json
          python -m unittest discover -s recomp/tests/local -p test_duke_pilot_generator.py -v
      - name: Publish generated GLB and 3-angle image in Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: duke-19-part-original-pilot-not-yet-in-game
          path: /tmp/duke-pilot/
          retention-days: 14
      - name: Commit original-art GLB and preview to repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p recomp/assets/models/duke-pilot
          cp /tmp/duke-pilot/duke-pilot.glb recomp/assets/models/duke-pilot/
          cp /tmp/duke-pilot/duke-pilot-assembled-preview.glb recomp/assets/models/duke-pilot/
          cp /tmp/duke-pilot/duke-pilot-preview.png recomp/assets/models/duke-pilot/
          cp /tmp/duke-pilot/model.json recomp/assets/models/duke-pilot/
          cp /tmp/duke-pilot/pilot-report.json recomp/assets/models/duke-pilot/
          git add recomp/assets/models/duke-pilot
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'assets: atualizar Duke original piloto GLB e preview'
            git push
          fi
